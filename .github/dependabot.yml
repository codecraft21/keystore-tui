# Dependabot version updates, batched monthly to keep PR noise low.
# Security updates are enabled in the repository settings and arrive as needed.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      # Ratatui and crossterm usually have to move together; check TUI
      # rendering by hand after merging these.
      tui:
        patterns:
          - "ratatui*"
          - "crossterm*"
      rust-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # release.yml is generated by dist; update it with `dist generate` instead.
    exclude-paths:
      - ".github/workflows/release.yml"
    groups:
      actions:
        patterns:
          - "*"
