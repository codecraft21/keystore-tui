# Publishes the crate to crates.io with Trusted Publishing (OIDC), so no
# long-lived token is stored. dist calls this from release.yml as a custom
# publish job and skips it for pre-releases. crates.io matches the publisher
# against the calling workflow, release.yml.
name: Publish to crates.io

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  publish-crates:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check whether this version is already on crates.io
        id: check
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if curl -fsS -o /dev/null \
            -A 'keystore-tui release workflow (https://github.com/codecraft21/keystore-tui)' \
            "https://crates.io/api/v1/crates/keystore-tui/$version"; then
            echo "keystore-tui $version is already on crates.io; skipping."
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Authenticate with crates.io
        id: auth
        if: steps.check.outputs.published != 'true'
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish
        if: steps.check.outputs.published != 'true'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
