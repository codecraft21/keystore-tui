name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Decides whether the change needs the Rust jobs. Changes to Markdown,
  # docs/, or the licence alone skip them, except docs/SPEC.md, which the
  # spec.rs test checks.
  changes:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.code == 'true' || steps.filter.outputs.spec == 'true' }}

    steps:
    - uses: actions/checkout@v7
    - uses: dorny/paths-filter@v3
      id: filter
      with:
        predicate-quantifier: every
        filters: |
          code:
            - '**'
            - '!**.md'
            - '!docs/**'
            - '!LICENSE*'
          spec:
            - 'docs/SPEC.md'

  build:

    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Check formatting
      run: cargo fmt --check
    - name: Lint
      run: cargo clippy --locked --all-targets -- -D warnings
    - name: Build
      run: cargo build --locked --verbose
    - name: Run tests, including terminal interaction and restoration
      run: cargo test --locked --verbose
      timeout-minutes: 10

  # Checks that the crate still builds with the `rust-version` in Cargo.toml,
  # which Dependabot doesn't check before raising dependency requirements.
  # Keep the toolchain here in step with `rust-version`.
  msrv:

    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Install the minimum supported Rust
      run: rustup toolchain install 1.88 --profile minimal
    - name: Build all targets with the minimum supported Rust
      run: cargo +1.88 check --locked --all-targets

  # Builds and tests on the other release platforms. macOS runs all tests,
  # including the PTY smoke tests. Windows builds the app, including the
  # Windows crossterm backend, and runs the unit tests; the PTY smoke tests
  # are Unix only. They are separate jobs rather than a matrix, so `ci-ok`
  # gets each platform's own result.
  macos:

    name: macOS
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v7
    - name: Build
      run: cargo build --locked --verbose
    - name: Run tests, including terminal interaction and restoration
      run: cargo test --locked --verbose
      timeout-minutes: 10

  windows:

    name: Windows
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7
    - name: Build
      run: cargo build --locked --verbose
    - name: Run unit tests
      run: cargo test --locked --verbose
      timeout-minutes: 10

  # Measures line coverage of all tests, including the PTY smoke tests, which
  # run the instrumented binary, and uploads it to Codecov for the README
  # badge. Codecov authenticates with OIDC, so no token is stored. An upload
  # failure (such as on fork PRs, which get no OIDC token) doesn't fail CI.
  coverage:

    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@v7
    - name: Install LLVM tools
      run: rustup component add llvm-tools-preview
    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-llvm-cov
    - name: Measure test coverage
      run: cargo llvm-cov --locked --lcov --output-path lcov.info
      timeout-minutes: 10
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: lcov.info
        disable_search: true
        use_oidc: true

  # The single required check for branch protection. It passes only when
  # every job above succeeded or was skipped for a docs-only change, so
  # skipped jobs don't leave PRs waiting for checks that never report. Any
  # other result fails it: failure, cancelled, or abandoned, which is how a
  # job that never got a runner ends.
  ci-ok:

    needs: [changes, build, msrv, macos, windows, coverage]
    if: always()
    runs-on: ubuntu-latest

    steps:
    - name: Check that every job succeeded or was skipped
      env:
        RESULTS: ${{ join(needs.*.result, ' ') }}
      run: |
        echo "Job results: $RESULTS"
        for result in $RESULTS; do
          case "$result" in
            success | skipped) ;;
            *) echo "A job ended with '$result'."; exit 1 ;;
          esac
        done
