name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Check formatting
      run: cargo fmt --check
    - name: Lint
      run: cargo clippy --locked --all-targets -- -D warnings
    - name: Build
      run: cargo build --locked --verbose
    - name: Run tests, including terminal interaction and restoration
      run: cargo test --locked --verbose
      timeout-minutes: 10

  # Checks that the crate still builds with the `rust-version` in Cargo.toml,
  # which Dependabot doesn't check before raising dependency requirements.
  # Keep the toolchain here in step with `rust-version`.
  msrv:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Install the minimum supported Rust
      run: rustup toolchain install 1.88 --profile minimal
    - name: Build all targets with the minimum supported Rust
      run: cargo +1.88 check --locked --all-targets

  # Builds and tests on the other release platforms. macOS runs all tests,
  # including the PTY smoke tests. Windows builds the app, including the
  # Windows crossterm backend, and runs the unit tests; the PTY smoke tests
  # are Unix only.
  platforms:

    name: platforms (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          test: cargo test --locked --verbose
        - os: windows-latest
          test: cargo test --locked --verbose
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7
    - name: Build
      run: cargo build --locked --verbose
    - name: Test
      run: ${{ matrix.test }}
      timeout-minutes: 10

  # Measures line coverage of all tests, including the PTY smoke tests, which
  # run the instrumented binary, and uploads it to Codecov for the README
  # badge. Codecov authenticates with OIDC, so no token is stored. An upload
  # failure (such as on fork PRs, which get no OIDC token) doesn't fail CI.
  coverage:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@v7
    - name: Install LLVM tools
      run: rustup component add llvm-tools-preview
    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-llvm-cov
    - name: Measure test coverage
      run: cargo llvm-cov --locked --lcov --output-path lcov.info
      timeout-minutes: 10
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: lcov.info
        disable_search: true
        use_oidc: true
