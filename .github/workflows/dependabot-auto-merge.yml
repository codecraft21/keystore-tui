name: Dependabot auto-merge

# Turns on auto-merge for every Dependabot PR, so GitHub merges it once the
# required checks pass. The checks, not this workflow, decide whether it lands.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:

    runs-on: ubuntu-latest
    # Only for PRs that Dependabot opened and last pushed to.
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]'

    steps:
    - name: Enable auto-merge with a merge commit
      run: gh pr merge --auto --merge "$PR_URL"
      env:
        PR_URL: ${{ github.event.pull_request.html_url }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
