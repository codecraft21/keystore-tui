[package]
name = "keystore-tui"
version = "1.0.1"
edition = "2024"
rust-version = "1.88"
description = "Read-only terminal UI for inspecting JKS, JCEKS, and PKCS12 keystores, certificates, and certificate requests"
license = "Apache-2.0"
repository = "https://github.com/codecraft21/keystore-tui"
homepage = "https://github.com/codecraft21/keystore-tui"
readme = "README.md"
keywords = ["keystore", "pkcs12", "jks", "x509", "tui"]
categories = ["command-line-utilities", "cryptography"]
include = [
    "/src",
    "/tests/fixtures",
    "/tests/terminal_smoke.py",
    "/docs/SPEC.md",
    "/docs/REFERENCE.md",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[dependencies]
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
sha1 = { version = "0.10.7", default-features = false }
zeroize = "1"
crown = { version = "0.31.1", default-features = false, features = ["alloc"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
strip = true
